name: 135i 1M Conversion
year: 2009
chassis: E82
engine: N54, single turbo
headline: The 1M, for a quarter of the price
hook: Full OEM 1M exterior, Garrett single turbo, around 550 whp.
order: 2
overview: |
  This car started as a joke. Lucas and Nick were watching 1 Series videos one night when Lucas said he'd find someone to trade his 1982 E24 633CSi for a 135i. Not long after, he did.

  Like a lot of 135i's, it came with a bit of power chased and the maintenance forgotten. The plan was Lucas's own idea of what the 1M should have been, for a fraction of what a real one costs. The exterior is a full OEM 1M conversion with the LCI updates. The rear quarters were made in steel rather than fiberglass: the arches were cut out, brackets welded on and the arches welded to the brackets. The car is wrapped in 3M satin white aluminum and still has its sunroof, the one tell that it isn't a real (always slick-top) 1M.

  Under the hood, a Speedtech top-mount kit with a Garrett GTW3684R replaced the twin turbos. It wasn't built to chase numbers or the track: Lucas wanted a fast street car that's easy to live with, and the single turbo frees up room in the engine bay. No more dropping the subframe to reach the water pump.
