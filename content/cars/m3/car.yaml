name: E92 M3 Frozen Blue
year: 2013
chassis: E92
engine: S65 4.0L V8
headline: The last great analog M3
hook: One of the last 150, GTS-inspired, owned since 2017.
order: 1
overview: |
  Lucas picked this M3 up from a dealer in the Greater Toronto Area in May 2017, bone stock. The carbon bits went on as soon as he got home, and a week later he drove it to Tampa. It replaced a W204 C63 that he grew to hate after a day at ICAR in Montreal. The plow understeer convinced him BMW and Porsche build cars around how they drive.

  It's a Frozen Edition competition package car, one of the last 150 built and from the last run of naturally aspirated M engines in M cars. This one is Monte Carlo blue under a satin clear. The build pulls from the GTS without the $200,000 price: a Mumbray Motorsport cage that's nearly a one-to-one copy of the GTS cage, Recaro Pole Positions, GTS sills, wheel and transmission software.

  It's the car Lucas took the buy-once, cry-once approach with, and both cupholders still work. Next up: F80 brakes, with hubs and spindles.
