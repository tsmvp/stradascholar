name: X5 35d X5M Conversion
year: 2011
chassis: E70
engine: 3.0L diesel
headline: The X5 BMW never built
hook: $4,200, 432,000 km, turned into a diesel X5M in a week.
order: 3
overview: |
  Lucas found this 2011 X5 35d on Facebook Marketplace listed at $6,000 and paid $4,200. It has 432,000 km on the clock. The pictures looked better than the car, but it had been well maintained until it was parked a few months earlier, it was already fully deleted, and it mostly needed a brake booster and brakes to get driving.

  Episode 1 was a clean bill of health: a brake switch fix, the 20% tint stripped off every window (windshield included), white cluster LEDs, an oil change, and pads and rotors at all four corners. Vapor Auto finished it with a full detail and a surprise badge delete.

  Episode 2 is the conversion. With Nick, Lucas replaced the rain trays and start/stop button and stripped the front end and sides. They pulled an all-nighter on bodywork, then wrapped the car, fitted the X5M bumpers, skirts, grilles and ducts, and built a quad-exit exhaust from the stock pipes. Lucas calls it the world's first diesel X5M, done in just under a week. A lift kit, wheels and tires come next.
